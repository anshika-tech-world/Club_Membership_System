<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <h1>Club Membership System</h1>

            <ul>
                <li><a href="01-index.html">Home</a></li>
                <li><a href="02-register.html">Register</a></li>
                <li><a href="03-login.html">Login</a></li>
                <li><a href="04-activities.html">Activities</a></li>
                <li><a href="05-members.html">Members</a></li>
                <li><a href="06-dashboard.html">Dashboard</a></li>
                <li><a href="07-requests.html">Requests</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="about">
            <h2>Club Registration</h2>

            <form id="registrationForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <br><br>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <br><br>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>

                <br><br>

                <label for="course">Course</label>
                <input type="text" id="course" placeholder="Enter your course" required>

                <br><br>

                <label for="club">Select Club</label>
                <select id="club" required>
                    <option value="">-- Select Club --</option>
                    <option value="Technical Club">Technical Club</option>
                    <option value="Cultural Club">Cultural Club</option>
                    <option value="Sports Club">Sports Club</option>
                    <option value="Literary Club">Literary Club</option>
                </select>

                <br><br>

                <button type="submit" class="btn">Register</button>

            </form>

            <p id="message" class="form-message" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Club Membership System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
